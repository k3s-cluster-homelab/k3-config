apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-stack-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/k3s-cluster-homelab/k3-config.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
