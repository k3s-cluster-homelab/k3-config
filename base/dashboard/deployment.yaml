apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-dashboard
  labels:
    app: deployment-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployment-dashboard
  template:
    metadata:
      labels:
        app: deployment-dashboard
    spec:
      containers:
        - name: dashboard
          image: deployment-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "64Mi"
