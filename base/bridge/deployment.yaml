apiVersion: v1
kind: ConfigMap
metadata:
  name: esp32-bridge-script
data:
  bridge.py: |
    import os
    import sys
    import time
    import json
    import urllib.request
    import paho.mqtt.client as mqtt

    ESP_HOST = os.getenv("ESP32_HOST", "192.168.177.28")
    MQTT_HOST = os.getenv("MQTT_HOST", "127.0.0.1")
    MQTT_PORT = int(os.getenv("MQTT_PORT", "31884"))
    CLIENT_ID = os.getenv("CLIENT_ID", "hauswasserwerk-esp32")
    TOPIC_PREFIX = os.getenv("TOPIC_PREFIX", "hauswasserwerk/esp32")

    def get_esp_status():
        url = f"http://{ESP_HOST}/status"
        req = urllib.request.Request(url, headers={'User-Agent': 'ESP32-K3s-Bridge'})
        with urllib.request.urlopen(req, timeout=3) as resp:
            if resp.status == 200:
                return json.loads(resp.read().decode('utf-8'))
        return None

    def send_esp_cmd(endpoint, payload=None):
        url = f"http://{ESP_HOST}/{endpoint}"
        data = payload.encode('utf-8') if payload else None
        headers = {'Content-Type': 'application/json'} if data else {}
        req = urllib.request.Request(url, data=data, headers=headers)
        try:
            with urllib.request.urlopen(req, timeout=3) as resp:
                print(f"[BRIDGE] Forwarded command to {url} (HTTP {resp.status})", flush=True)
        except Exception as e:
            print(f"[BRIDGE] Error forwarding command to {url}: {e}", flush=True)

    def on_connect(client, userdata, flags, rc):
        print(f"[BRIDGE] Connected to Mosquitto at {MQTT_HOST}:{MQTT_PORT} (rc={rc})", flush=True)
        client.publish(f"{TOPIC_PREFIX}/online", "true", qos=1, retain=True)
        cmd_topic = f"{TOPIC_PREFIX}/cmd/#"
        client.subscribe(cmd_topic, qos=1)
        print(f"[BRIDGE] Subscribed to {cmd_topic}", flush=True)

    def on_message(client, userdata, msg):
        try:
            topic = msg.topic
            payload = msg.payload.decode('utf-8')
            print(f"[BRIDGE] MQTT cmd received: {topic} -> {payload}", flush=True)
            parts = topic.split('/')
            if len(parts) >= 4 and parts[2] == 'cmd':
                cmd = parts[3]
                send_esp_cmd(cmd, payload if payload else None)
        except Exception as e:
            print(f"[BRIDGE] on_message error: {e}", flush=True)

    client = mqtt.Client(client_id=CLIENT_ID)
    client.will_set(f"{TOPIC_PREFIX}/online", "false", qos=1, retain=True)
    client.on_connect = on_connect
    client.on_message = on_message

    print(f"[BRIDGE] Starting ESP32 Bridge: {ESP_HOST} -> {MQTT_HOST}:{MQTT_PORT}...", flush=True)
    while True:
        try:
            client.connect(MQTT_HOST, MQTT_PORT, keepalive=30)
            break
        except Exception as e:
            print(f"[BRIDGE] Waiting for broker {MQTT_HOST}:{MQTT_PORT}... ({e})", flush=True)
            time.sleep(3)

    client.loop_start()

    while True:
        try:
            status = get_esp_status()
            if status:
                payload = json.dumps(status)
                client.publish(f"{TOPIC_PREFIX}/status", payload, qos=0)
                client.publish(f"{TOPIC_PREFIX}/online", "true", qos=1, retain=True)
        except Exception as e:
            print(f"[BRIDGE] Polling error ({ESP_HOST}): {e}", flush=True)
            client.publish(f"{TOPIC_PREFIX}/online", "false", qos=1, retain=True)
        time.sleep(2)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esp32-bridge
  labels:
    app: esp32-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esp32-bridge
  template:
    metadata:
      labels:
        app: esp32-bridge
    spec:
      hostNetwork: true
      containers:
        - name: bridge
          image: python:3.11-alpine
          command: ["sh", "-c"]
          args:
            - |
              pip install --no-cache-dir paho-mqtt==1.6.1 && python -u /app/bridge.py
          env:
            - name: ESP32_HOST
              value: "192.168.177.28"
            - name: MQTT_HOST
              value: "127.0.0.1"
            - name: MQTT_PORT
              value: "31884"
            - name: CLIENT_ID
              value: "hauswasserwerk-esp32"
            - name: TOPIC_PREFIX
              value: "hauswasserwerk/esp32"
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: script
          configMap:
            name: esp32-bridge-script
