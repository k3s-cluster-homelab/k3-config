apiVersion: batch/v1
kind: Job
metadata:
  name: esp32-firmware-flasher
  labels:
    app: esp32-flasher
  # Manuelles On-Demand-Job: Kein automatischer Sync-Hook, um PROD vor versehentlichem Flashen zu schuetzen
  # annotations:
  #   argocd.argoproj.io/hook: Sync
  #   argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: esp32-flasher
    spec:
      hostNetwork: true
      restartPolicy: OnFailure
      initContainers:
        - name: extract-firmware
          image: hauswerk-firmware:latest
          command: ["sh", "-c", "cp /firmware/firmware.bin /data/firmware.bin"]
          volumeMounts:
            - name: shared-data
              mountPath: /data
      containers:
        - name: flasher
          image: esp32-flasher:latest
          args:
            - "--host"
            - "$(ESP32_IP)"
            - "--firmware"
            - "/data/firmware.bin"
          env:
            - name: ESP32_IP
              value: "192.168.177.28"
          volumeMounts:
            - name: shared-data
              mountPath: /data
      volumes:
        - name: shared-data
          emptyDir: {}
