apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-stack-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DEIN-USER/k3-config.git
    targetRevision: develop
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
