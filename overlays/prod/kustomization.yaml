apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
images:
  - name: app-frontend
    newName: 192.168.178.183:5010/app-frontend
    newTag: stable
  - name: hauswerk-firmware
    newName: 192.168.178.183:5010/hauswerk-firmware
    newTag: stable
  - name: esp32-flasher
    newName: 192.168.178.183:5010/esp32-flasher
    newTag: latest
patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: mosquitto
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"
  - target:
      kind: Job
      name: esp32-firmware-flasher
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "Hauswasserwerk.local"
