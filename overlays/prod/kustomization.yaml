apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - namespace.yaml
  - ../../base
images:
  - name: app-frontend
    newName: localhost:5010/app-frontend
    newTag: stable
patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: mosquitto
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"
